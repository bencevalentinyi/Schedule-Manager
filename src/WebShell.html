<!-- Web app navigation bar (WebApp.gs puts it at the top of every page). Uses the page's theme. -->
<style>
  .web-nav {
    flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 4px var(--s2); min-height: 52px; position: sticky; top: 0; z-index: 30;
    padding: 8px max(var(--pad-x), calc((100% - var(--web-max, 1180px)) / 2));
    background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: var(--shadow-xs);
  }
  .web-nav .web-brand {
    display: inline-flex; align-items: center; gap: 8px; font-weight: 650; color: var(--text); text-decoration: none; margin-right: var(--s3);
    white-space: nowrap; letter-spacing: -.01em; border-radius: var(--radius);
  }
  .web-nav .web-mark {
    width: 26px; height: 26px; border-radius: 7px; background: var(--primary); color: var(--primary-text);
    display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .web-nav .web-mark svg { width: 15px; height: 15px; }
  .web-nav .web-links { display: flex; flex-wrap: wrap; gap: 2px; }
  .web-nav .web-links a, .web-nav .web-sheet {
    padding: 6px 10px; border-radius: var(--radius); color: var(--text-2); text-decoration: none; font-weight: 500; white-space: nowrap;
    transition: background var(--ease, 150ms), color var(--ease, 150ms);
  }
  .web-nav .web-links a:hover, .web-nav .web-sheet:hover { background: var(--muted-bg); color: var(--text); }
  .web-nav .web-links a[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .web-nav .web-sheet { border: 1px solid var(--border); }
  .web-nav .web-links a:focus-visible, .web-nav .web-sheet:focus-visible, .web-nav .web-brand:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .web-nav .web-sheet { margin-left: auto; }
  /* The page itself: full-width bars, content centered at the page's width. Only the side padding
     (--pad-x) is widened, never the padding itself, so a theme's extra room for its logo
     (padding-right: calc(var(--pad-x) + …), logo at right: var(--pad-x)) stays intact. */
  body.web-page > .app-header, body.web-page > .app-body, body.web-page > .app-footer {
    --pad-x: max(20px, calc((100% - var(--web-max, 1180px)) / 2));
  }
  body.web-page.sidebar > .app-header, body.web-page.sidebar > .app-body, body.web-page.sidebar > .app-footer {
    --pad-x: max(14px, calc((100% - var(--web-max, 1180px)) / 2));
  }
  /* Content never wider than the page: long words, tables and toolbars wrap or scroll inside. */
  body.web-page .app-body { overflow-x: hidden; }
  body.web-page .head-row { flex-wrap: wrap; }
  body.web-page .head-row > * { min-width: 0; }
  body.web-page .table-wrap { max-width: 100%; overflow-x: auto; }
  body.web-page pre, body.web-page code { overflow-wrap: anywhere; }
  body.web-page { background: var(--surface); }
  /* Phones: the links scroll sideways in one row; tables scroll inside their box. */
  @media (max-width: 620px) {
    .web-nav { flex-wrap: nowrap; overflow-x: auto; padding: 6px 10px; -webkit-overflow-scrolling: touch; }
    .web-nav .web-brand { display: none; }
    .web-nav .web-links { flex-wrap: nowrap; }
    .web-nav .web-sheet { margin-left: 0; }
    body.web-page > .app-header, body.web-page > .app-body, body.web-page > .app-footer,
    body.web-page.sidebar > .app-header, body.web-page.sidebar > .app-body, body.web-page.sidebar > .app-footer { --pad-x: 12px; }
    body.web-page .app-header .subtitle { display: none; }
    body.web-page .table-wrap { overflow-x: auto; }
  }
  .web-loading { position: fixed; top: 0; left: 0; height: 3px; width: 100%; z-index: 1000; background: var(--primary);
    transform-origin: left; animation: web-load 1.6s ease-out forwards; }
  @keyframes web-load { from { transform: scaleX(.05); } to { transform: scaleX(.85); } }
</style>
<script>
  // Opening another page reloads the whole page; show progress at once so the click feels instant.
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[target="_top"]');
    if (!a || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button) return;
    if (!document.querySelector('.web-loading')) { var bar = document.createElement('div'); bar.className = 'web-loading'; document.body.appendChild(bar); }
  });
</script>
<nav class="web-nav" aria-label="<?= appName ?>">
  <a class="web-brand" href="<?= homeUrl ?>" target="_top"><span class="web-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span><?= appName ?></a>
  <div class="web-links">
    <? for (var i = 0; i < nav.length; i++) { ?>
      <a href="<?= nav[i].href ?>" target="_top"<? if (nav[i].current) { ?> aria-current="page"<? } ?>><?= nav[i].label ?></a>
    <? } ?>
  </div>
  <a class="web-sheet" href="<?= spreadsheetUrl ?>" target="_blank" rel="noopener">Open spreadsheet ↗</a>
</nav>
