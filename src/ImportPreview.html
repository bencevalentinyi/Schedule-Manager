<!-- Included by ImportDialog.html: renders the analysis returned by apiImportAnalyze / apiImportCommit. -->
<script>

  /** Collapsible detail section; open when it needs attention. */
  function detailSection(title, count, bodyHtml, open, kind) {
    return '<details class="disclosure"' + (open ? ' open' : '') + '><summary>' + esc(title) + ' ' + badge(kind || '', String(count)) + '</summary>' +
      '<div class="disclosure-body">' + bodyHtml + '</div></details>';
  }
  function tableHtml(headers, rows, numCols) {
    numCols = numCols || [];
    return '<div class="table-wrap mt-3"><table class="table"><thead><tr>' + headers.map(function (h, i) {
      return '<th scope="col"' + (numCols.indexOf(i) >= 0 ? ' class="num"' : '') + '>' + esc(h) + '</th>';
    }).join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }
  function n(v) { return Number(v) || 0; }

  var HELD_REASONS = {
    NOT_IN_STAFF: 'Not in any staff sheet',
    IN_SEVERAL: 'In several staff sheets',
    NOT_IN_TEAM: 'Not in this team\'s staff sheet'
  };
  /**
   * Employees held back for review, each with a team / Skip choice. The choices are kept in the
   * page's `decisions` object (ImportDialog) and sent with the next Re-check.
   */
  function heldHtml(people) {
    if (!people.length) return '';
    var chosen = typeof decisions !== 'undefined' ? decisions : {};
    var suggestable = people.filter(function (h) { return (h.foundIn || []).length === 1; }).length;
    var rows = people.map(function (h, k) {
      var cur = chosen[h.key] || '';
      var opts = '<option value="">— decide —</option>' + h.candidates.map(function (c, i) {
        // For a one-team import the first candidate is that team; the others send the rows to another team's schedule.
        var label = h.reason === 'NOT_IN_TEAM' && i === 0 ? 'Import to ' + c.teamName + ' anyway' : (h.reason === 'NOT_IN_TEAM' ? 'Add to ' + c.teamName : c.teamName);
        if (c.inStaffSheet) label += ' (in its staff sheet)';
        return '<option value="' + esc(c.teamId) + '"' + (cur === c.teamId ? ' selected' : '') + '>' + esc(label) + '</option>';
      }).join('') + '<option value="SKIP"' + (cur === 'SKIP' ? ' selected' : '') + '>Skip</option>';
      var found = (h.foundIn || []).map(function (t) { return (h.candidates.filter(function (c) { return c.teamId === t; })[0] || {}).teamName || t; });
      var why = esc(HELD_REASONS[h.reason] || h.reason) + (h.reason === 'NOT_IN_TEAM' && found.length ? '<div class="small muted">In the staff sheet of ' + esc(found.join(', ')) + '</div>' : '');
      return '<tr class="attention"><td>' + esc(h.employeeName || '(no name)') + '</td><td>' + esc(h.employeeId || '—') + '</td><td class="num">' + h.rows + '</td><td>' + why + '</td>' +
        '<td><label class="sr-only" for="held' + k + '">Decision for ' + esc(h.employeeName) + '</label><select id="held' + k + '" data-held="' + esc(h.key) + '" onchange="decisionChanged(this)">' + opts + '</select></td></tr>';
    });
    return '<div class="panel mt-3"><div class="panel-head"><h3>Held back for review ' + badge('bad', String(people.length)) + '</h3></div>' +
      '<p class="hint mt-0">These people were not imported yet. Choose a team for each (their rows go to that team\'s schedule) or Skip, then click <b>Re-check</b>. To match them automatically next time, add them to the right staff sheet (View Staff Directory) with exactly the name used in Quinyx.</p>' +
      tableHtml(['Employee', 'Employee ID', 'Rows', 'Why', 'Decision'], rows, [2]) +
      '<div class="cluster mt-2">' + (suggestable ? '<button type="button" class="btn sm" onclick="useStaffSheetTeams()">Use the staff-sheet team for ' + suggestable + ' person(s)</button>' : '') +
      '<button type="button" class="btn sm" onclick="skipAllHeld()">Skip the rest</button><span class="spacer"></span>' +
      '<button type="button" class="btn sm primary" onclick="analyze()">Re-check</button></div></div>';
  }

  function renderPreview(p) {
    var S = p.summary;
    var html = '';

    // Source facts
    html += '<dl class="facts">' +
      '<div><dt>File</dt><dd>' + esc(p.sourceFile) + (p.sheetName ? ' <span class="muted">· ' + esc(p.sheetName) + '</span>' : '') + '</dd></div>' +
      '<div><dt>Format</dt><dd>' + esc(p.format) + '</dd></div>' +
      (S.scheduleDate ? '<div><dt>Schedule date</dt><dd>' + esc(S.scheduleDate) + '</dd></div>' : '') +
      '<div><dt>Shift dates</dt><dd>' + esc(S.dateFrom ? S.dateFrom + (S.dateTo !== S.dateFrom ? ' → ' + S.dateTo : '') : '—') + '</dd></div>' +
      (p.dateOrder ? '<div><dt>Date order</dt><dd>' + esc(p.dateOrder) + '</dd></div>' : '') + '</dl>';
    if (S.shiftTypeFilters && S.shiftTypeFilters.length) {
      html += '<p class="small"><b>Selected shift types</b> — ' + S.shiftTypeFilters.map(function (f) {
        return esc(f.teamName) + ': ' + (f.mode === 'ALL' ? 'all' : f.mode === 'SELECTED' ? esc(f.types.join(', ') || '(none)') : badge('bad', 'Not configured'));
      }).join(' · ') + '</p>';
    }
    (p.fileWarnings || []).forEach(function (w) { html += alertHtml('warning', '', esc(w)); });

    // Status of the whole import
    if (p.blockers.length) html += alertHtml('error', 'The import cannot be applied yet', '', p.blockers);
    else html += alertHtml('success', 'Ready to apply', 'Review the summary and the confirmation below, then click <b>Apply import</b>.');
    html += heldHtml(S.heldPeople || []);

    // Metrics, grouped
    var group = function (title, tiles) { return '<div class="stat-group"><div class="eyebrow">' + esc(title) + '</div><div class="stats mb-0">' + tiles.join('') + '</div></div>'; };
    html += group('Source', [
      stat('Source records', S.sourceRows),
      stat('Valid', S.validRows, 'good'),
      stat('Rejected', S.rejectedRows, S.rejectedRows ? 'bad' : ''),
      stat('Excluded by shift type', S.excludedByShiftType, S.excludedByShiftType ? 'warn' : '')
    ]);
    html += group('Changes', [
      stat('New assignments', n(S.insert) + n(S.restore), 'good'),
      stat('Updated', S.update),
      stat('Removed (replace)', S.remove, S.remove ? 'warn' : ''),
      stat('Unchanged', S.unchanged),
      stat('Potential duplicates', S.potentialDuplicates, S.changedPending ? 'warn' : '')
    ]);
    html += group('Shifts and meetings', [
      stat('Normal shifts', S.normalShifts),
      stat('Meetings detected', S.meetingsDetected, S.meetingsDetected ? 'meeting' : ''),
      stat('Meetings included', S.meetingsSelected, S.meetingsSelected ? 'meeting' : ''),
      stat('Meetings excluded', S.meetingsExcluded, S.meetingsExcluded ? 'warn' : '')
    ]);
    var attention = [
      ['Held for review', (S.heldPeople || []).length, 'bad'], ['Unknown employees', S.unknownEmployeeCount, 'warn'],
      ['Invalid times', S.invalidTimes, 'bad'], ['Unreadable shift info', S.unparseableShiftInfo, 'bad'], ['Missing employee name', S.missingEmployee, 'bad'],
      ['Hours missing / invalid', n(S.hoursMissing) + n(S.hoursInvalid), 'warn'], ['Hours differ', S.hoursDiscrepancies, 'warn'], ['Overlaps', S.overlapsCount, 'warn']
    ];
    var hits = attention.filter(function (a) { return n(a[1]) > 0; });
    html += hits.length ? group('Needs attention', hits.map(function (a) { return stat(a[0], a[1], a[2]); }))
      : '<div class="stat-group"><div class="eyebrow">Needs attention</div><p class="small mb-0">' + badge('ok', 'Nothing') + ' No unknown employees, invalid times or overlaps.</p></div>';

    html += renderReport(p.report);

    // Details
    if (S.shiftTypes && S.shiftTypes.length) {
      html += detailSection('Shift types in the file', S.shiftTypes.length, tableHtml(['Shift type', 'Rows', 'Imported', 'Excluded', ''],
        S.shiftTypes.map(function (t) {
          return '<tr><td>' + esc(t.type || '(blank)') + '</td><td class="num">' + t.rows + '</td><td class="num">' + t.included + '</td><td class="num">' + t.excluded + '</td><td>' +
            (t.isNew ? badge('warn', 'New') : '') + (t.excluded && !t.included ? ' ' + badge('', 'Excluded') : '') + '</td></tr>';
        }), [1, 2, 3]), S.shiftTypes.some(function (t) { return t.isNew; }));
    }
    if (S.teams.length) {
      html += detailSection('Teams', S.teams.length, tableHtml(['Team', 'Valid rows', 'Dates', 'New', 'Updated', 'Removed', 'Unchanged', 'Skipped', 'Pending', 'Rejected'],
        S.teams.map(function (t) {
          return '<tr><td>' + esc(t.teamName) + '</td><td class="num">' + t.rows + '</td><td class="nowrap">' + esc(t.dateFrom ? t.dateFrom + ' → ' + t.dateTo : '—') + '</td><td class="num">' + t.insert +
            '</td><td class="num">' + t.update + '</td><td class="num">' + t.remove + '</td><td class="num">' + t.unchanged + '</td><td class="num">' + t.skipped +
            '</td><td class="num">' + t.pending + '</td><td class="num">' + t.rejected + '</td></tr>';
        }), [1, 3, 4, 5, 6, 7, 8, 9]), S.teams.length > 1);
    }
    if (p.rejected.length) {
      html += detailSection('Rejected rows', p.rejectedTotal, tableHtml(['Row', 'Team', 'Reason'],
        p.rejected.map(function (r) { return '<tr><td class="num">' + r.row + '</td><td>' + esc(r.team) + '</td><td class="wrap">' + esc(r.reasons.join(' ')) + '</td></tr>'; }), [0]) +
        (p.rejectedTotal > p.rejected.length ? '<p class="hint">Showing the first ' + p.rejected.length + '.</p>' : ''), true, 'bad');
    }
    if (S.unknownEmployees.length) {
      html += detailSection('Unknown employees', S.unknownEmployeeCount, tableHtml(['Team', 'Employee ID', 'Name', 'Rows', 'Note'],
        S.unknownEmployees.map(function (u) { return '<tr><td>' + esc(u.team) + '</td><td>' + esc(u.employeeId || '—') + '</td><td>' + esc(u.employeeName) + '</td><td class="num">' + u.rows + '</td><td class="wrap">' + esc(u.reason) + '</td></tr>'; }), [3]) +
        '<p class="hint">Unknown employees are imported and flagged. Add them later with View Staff Directory → Unknown….</p>', false, 'warn');
    }
    if (S.overlaps.length) {
      html += detailSection('Overlapping assignments', S.overlaps.length, '<ul class="plain small">' + S.overlaps.map(function (o) { return '<li>' + esc(o) + '</li>'; }).join('') + '</ul>', false, 'warn');
    }
    if (p.rowWarnings.length) {
      html += detailSection('Row warnings', p.rowWarningsTotal, tableHtml(['Row', 'Warning'],
        p.rowWarnings.map(function (r) { return '<tr><td class="num">' + r.row + '</td><td class="wrap">' + esc(r.messages.join(' ')) + '</td></tr>'; }), [0]), false, 'warn');
    }
    if (p.unmappedColumns.length) {
      html += '<p class="hint"><b>Unmapped columns</b> (kept in each record\'s Extra JSON, shown when a team lists them as team-specific fields): ' + esc(p.unmappedColumns.join(', ')) + '</p>';
    }
    return html;
  }

  /**
   * "What will be written" summary shown before Apply. Built only from the plan
   * returned by the server, so it matches what the commit will do.
   * strategies: {KEY: label}
   */
  function renderConfirmation(p, strategies) {
    var S = p.summary;
    if (!S.teams.length) return '';
    var imported = (S.shiftTypes || []).filter(function (t) { return t.included > 0; }).map(function (t) { return t.type || '(blank)'; });
    var rows = [
      ['Teams affected', esc(S.teams.map(function (t) { return t.teamName; }).join(', '))],
      ['Dates affected', S.teams.map(function (t) { return esc(t.teamName) + ': ' + esc(t.dateFrom ? t.dateFrom + (t.dateTo !== t.dateFrom ? ' → ' + t.dateTo : '') : '—'); }).join('<br>')],
      ['Activity types imported', imported.length ? esc(imported.join(', ')) : '<span class="muted">All rows of the file (no shift-type column)</span>'],
      ['Meetings', n(S.meetingsSelected) ? badge('meeting', n(S.meetingsSelected) + ' included') + ' as separate assignments' : (n(S.meetingsExcluded) ? n(S.meetingsExcluded) + ' excluded (meeting import off)' : 'None in this file')],
      ['Duplicate handling', esc(strategies[p.strategy] || p.strategy)],
      ['Existing records', (n(S.update) ? n(S.update) + ' will be updated' : 'None updated') + (n(S.remove) ? ' · <b>' + n(S.remove) + ' will be marked REMOVED</b> (replace)' : '') +
        (n(S.unchanged) ? ' · ' + n(S.unchanged) + ' unchanged' : '')],
      ['New assignments', String(n(S.insert) + n(S.restore))]
    ];
    return '<div class="panel mt-4"><div class="panel-head"><h3>Confirm what will be written</h3></div>' + kvTable(rows) +
      '<p class="hint">Applying writes a journal first, so the whole import can be undone with Undo Last Import.</p></div>';
  }
</script>
