<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Styles') ?>
</head>
<body>
  <h1>Configure Team Types</h1>
  <p class="muted">Team types are reusable defaults. Teams using the <i>Standard</i> layout follow their type's schedule columns automatically; staff fields are copied to a team when it is created.</p>
  <div id="status"></div>
  <div class="row" style="align-items:flex-start">
    <div style="flex:0 0 250px">
      <div class="scroll" style="max-height:420px" id="list"></div>
      <p><button class="btn small" onclick="edit(null)">+ New team type</button></p>
    </div>
    <div style="flex:1 1 420px" id="editor" class="hidden">
      <div class="row">
        <div><label for="typeName">Name *</label><input type="text" id="typeName" maxlength="60"></div>
        <div><label for="defaultProfile">Default import profile</label><select id="defaultProfile"></select></div>
      </div>
      <label for="typeDescription">Description</label>
      <input type="text" id="typeDescription" maxlength="500">
      <h3>Schedule columns</h3>
      <div class="checks card" id="schedFields"></div>
      <h3>Staff fields</h3>
      <div class="checks card" id="staffFields"></div>
      <label for="customStaff">Custom staff fields (comma-separated)</label>
      <input type="text" id="customStaff">
      <h3>Display defaults</h3>
      <div class="row">
        <div><label for="hMode">Operating hours</label><select id="hMode" onchange="show('hTimes', this.value !== '24_7')"></select></div>
      </div>
      <div class="row" id="hTimes">
        <div><label for="wStart">From</label><input type="time" id="wStart"></div>
        <div><label for="wEnd">Until (23:59 = midnight)</label><input type="time" id="wEnd"></div>
      </div>
      <label class="inline"><input type="checkbox" id="dBreaks"> Show breaks</label>
      <label class="inline"><input type="checkbox" id="dDur"> Show durations</label>
      <label class="inline"><input type="checkbox" id="dTeam"> Show team-specific fields</label>
      <label class="inline"><input type="checkbox" id="dHead"> Show headcount</label>
      <p class="small muted" id="usage"></p>
      <p>
        <button class="btn primary" onclick="save()">Save team type</button>
        <button class="btn" id="toggleBtn" onclick="toggle()">Disable</button>
        <button class="btn danger" id="deleteBtn" onclick="del()">Delete</button>
      </p>
    </div>
  </div>
  <div class="footer"><span class="spacer"></span><button class="btn" onclick="closeDialog()">Close</button></div>

  <?!= include('ClientCore') ?>
  <script>
    var BOOT = <?!= bootJson ?>;
    var data = null, current = null;

    function load(selectId) {
      call('Loading…', 'apiListTeamTypes').then(function (d) {
        data = d;
        $('defaultProfile').innerHTML = options(d.profiles, 'profileId', 'profileName', '', '(none — auto-detect)');
        $('list').innerHTML = d.types.map(function (t, i) {
          return '<div class="list-item" data-i="' + i + '" onclick="edit(' + i + ')"><b>' + esc(t.typeName) + '</b> ' +
            (t.enabled ? '' : '<span class="badge warn">disabled</span>') +
            '<div class="small muted">' + esc(t.typeId) + ' · ' + t.teamCount + ' team(s)</div></div>';
        }).join('') || '<p class="muted" style="padding:8px">No team types yet.</p>';
        var idx = selectId ? d.types.map(function (t) { return t.typeId; }).indexOf(selectId) : -1;
        if (idx >= 0) edit(idx);
      });
    }

    function edit(i) {
      current = i === null ? null : data.types[i];
      document.querySelectorAll('.list-item').forEach(function (el) { el.classList.toggle('sel', Number(el.dataset.i) === i); });
      var t = current || { typeName: '', description: '', scheduleFields: data.defaults.scheduleFields, staffFields: data.defaults.staffFields,
        defaultImportProfileId: '', display: data.defaults.display, enabled: true, teamCount: 0 };
      $('typeName').value = t.typeName; $('typeDescription').value = t.description;
      $('defaultProfile').value = t.defaultImportProfileId || '';
      $('schedFields').innerHTML = Object.keys(data.displayFields).map(function (k) {
        var locked = k === 'start' || k === 'end';
        return '<label class="inline"><input type="checkbox" data-f="' + k + '"' + (t.scheduleFields.indexOf(k) >= 0 || locked ? ' checked' : '') + (locked ? ' disabled' : '') + '> ' + esc(data.displayFields[k].label) + '</label>';
      }).join('');
      var staffChoices = Object.keys(data.staffFieldDefs).map(function (k) { return { k: k, l: data.staffFieldDefs[k].label, req: data.staffFieldDefs[k].required }; })
        .concat(data.staffRegistry.map(function (f) { return { k: 'field:' + f.fieldKey, l: f.displayName + (f.fieldType === 'IDENTIFIER' ? ' (ID)' : ''), req: false }; }));
      $('staffFields').innerHTML = staffChoices.map(function (c) {
        return '<label class="inline"><input type="checkbox" data-s="' + esc(c.k) + '"' + (t.staffFields.indexOf(c.k) >= 0 || c.req ? ' checked' : '') + (c.req ? ' disabled' : '') + '> ' + esc(c.l) + '</label>';
      }).join('');
      $('customStaff').value = t.staffFields.filter(function (f) { return f.indexOf('custom:') === 0; }).map(function (f) { return f.substr(7); }).join(', ');
      $('hMode').innerHTML = options(Object.keys(data.operatingModes).map(function (k) { return { k: k, l: data.operatingModes[k] }; }), 'k', 'l', t.display.operatingHoursMode || 'STANDARD');
      show('hTimes', t.display.operatingHoursMode !== '24_7');
      $('wStart').value = t.display.operatingHoursStart; $('wEnd').value = t.display.operatingHoursEnd === '24:00' ? '23:59' : t.display.operatingHoursEnd;
      $('dBreaks').checked = t.display.showBreaks; $('dDur').checked = t.display.showDurations;
      $('dTeam').checked = t.display.showTeamFields; $('dHead').checked = t.display.showHeadcount;
      $('usage').textContent = current ? 'Used by ' + current.teamCount + ' team(s).' : 'New team type.';
      show('toggleBtn', !!current); show('deleteBtn', !!current);
      $('toggleBtn').textContent = current && !current.enabled ? 'Enable' : 'Disable';
      show('editor', true);
      showStatus('', '');
    }

    function collect() {
      var order = current ? current.scheduleFields : data.defaults.scheduleFields;
      var checked = Array.prototype.filter.call(document.querySelectorAll('[data-f]'), function (c) { return c.checked; }).map(function (c) { return c.dataset.f; });
      var staff = Array.prototype.filter.call(document.querySelectorAll('[data-s]'), function (c) { return c.checked; }).map(function (c) { return c.dataset.s; });
      $('customStaff').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (c) { staff.push('custom:' + c); });
      return {
        typeId: current ? current.typeId : '', typeName: $('typeName').value, description: $('typeDescription').value,
        scheduleFields: order.filter(function (f) { return checked.indexOf(f) >= 0; }).concat(checked.filter(function (f) { return order.indexOf(f) < 0; })),
        staffFields: staff, defaultImportProfileId: $('defaultProfile').value,
        display: { operatingHoursMode: $('hMode').value, operatingHoursStart: $('wStart').value, operatingHoursEnd: $('wEnd').value, showBreaks: $('dBreaks').checked,
          showDurations: $('dDur').checked, showTeamFields: $('dTeam').checked, showHeadcount: $('dHead').checked },
        enabled: current ? current.enabled : true
      };
    }

    function save() {
      call('Saving…', 'apiSaveTeamType', collect()).then(function (t) { showStatus('ok', 'Saved team type ' + esc(t.typeName) + '.'); load(t.typeId); });
    }
    function toggle() {
      call('Saving…', 'apiSetTeamTypeEnabled', current.typeId, !current.enabled).then(function (t) { load(t.typeId); });
    }
    function del() {
      if ($('deleteBtn').dataset.armed !== '1') { $('deleteBtn').dataset.armed = '1'; $('deleteBtn').textContent = 'Click again to delete'; return; }
      $('deleteBtn').dataset.armed = '';
      call('Deleting…', 'apiDeleteTeamType', current.typeId).then(function () { show('editor', false); showStatus('ok', 'Deleted.'); load(); });
    }
    load();
  </script>
</body>
</html>
