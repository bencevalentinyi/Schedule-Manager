<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Styles') ?>
  <style>
    .list { max-height: none; }
  </style>
</head>
<body class="sidebar">
  <main class="app-body" id="main">
    <div class="field">
      <label class="label" for="team">Team</label>
      <select id="team" onchange="search()"></select>
    </div>
    <div id="dirInfo"></div>
    <div id="status" aria-live="polite"></div>

    <!-- List view -->
    <section id="listView">
      <div class="search field mb-0"><label class="sr-only" for="q">Search staff</label>
        <input type="search" id="q" placeholder="Search name, ID, role…" onkeydown="if (event.key === 'Enter') search()" onsearch="search()"></div>
      <div class="cluster mt-2" style="justify-content:flex-end">
        <button type="button" class="btn sm" onclick="search()">Search</button>
      </div>
      <p class="small muted mt-2 mb-0" id="count" aria-live="polite"></p>
      <div class="list mt-2" id="results" role="list"></div>
    </section>

    <!-- Editor view -->
    <section id="editor" class="hidden" aria-labelledby="edTitle">
      <button type="button" class="btn ghost sm" onclick="backToList()" style="margin-left:-8px">← Back to list</button>
      <h2 id="edTitle" class="mt-2">Staff member</h2>
      <div id="edFields"></div>
      <div class="cluster">
        <button type="button" class="btn primary" onclick="save()">Save</button>
      </div>
    </section>

    <!-- Unknown employees view -->
    <section id="unknown" class="hidden" aria-labelledby="unkTitle">
      <button type="button" class="btn ghost sm" onclick="backToList()" style="margin-left:-8px">← Back to list</button>
      <h2 id="unkTitle" class="mt-2">Unknown employees</h2>
      <p class="hint mt-0">People in this team's imported schedules who are not in its staff sheet.</p>
      <div id="unknownList"></div>
      <button type="button" class="btn primary mt-3" id="addUnknownBtn" onclick="addUnknown()">Add selected</button>
    </section>
  </main>
  <footer class="app-footer" id="footer">
    <button type="button" class="btn primary sm" onclick="edit(null)">+ Add staff</button>
    <button type="button" class="btn sm" onclick="loadUnknown()">Unknown…</button>
    <button type="button" class="btn sm" onclick="openTool('ids', null, 'apiShowIdImportDialog')" title="Fill in Employee IDs from a Quinyx Custom report (Badge no. + Name)">Import IDs…</button>
    <span class="spacer"></span>
    <button type="button" class="btn ghost sm" onclick="openSheet()" title="Open the staff sheet (table with all columns)">Open sheet</button>
  </footer>

  <?!= include('ClientCore') ?>
  <script>
    var BOOT = <?!= bootJson ?>;
    var list = null, editing = null, unknown = [];

    function init() {
      call('Loading…', 'apiStaffBootstrap').then(function (b) {
        if (!b.teams.length) {
          show('listView', false); show('footer', false);
          $('dirInfo').innerHTML = emptyHtml('☺', 'No teams yet', 'Create a team under Setup &amp; Configuration → Create New Team. Its staff directory then appears here.');
          return;
        }
        $('team').innerHTML = options(b.teams, 'teamId', 'teamName', b.currentTeamId || b.teams[0].teamId);
        search();
      });
    }
    function teamId() { return $('team').value; }
    function view(name) {
      show('listView', name === 'list'); show('editor', name === 'editor'); show('unknown', name === 'unknown');
      $('main').scrollTop = 0;
    }
    function backToList() { showStatus('', ''); view('list'); }

    /** Reloads the list; okTitle is shown as a success message once the list is back. */
    function search(okTitle) {
      view('list');
      $('results').innerHTML = '<div class="inline-loading" style="padding:12px"><span class="spinner" aria-hidden="true"></span>Searching…</div>';
      call('Searching…', 'apiStaffList', teamId(), $('q').value).then(function (r) {
        list = r;
        $('count').textContent = r.total + ' match(es)' + (r.total > r.rows.length ? ', showing the first ' + r.rows.length : '');
        $('dirInfo').innerHTML = '';
        if (r.duplicates.length) showStatus('warn', esc(r.duplicates.join('; ')) + '. Fix them in the staff sheet.', 'Duplicate identifiers in this sheet');
        else if (okTitle) showStatus('ok', '', okTitle);
        else showStatus('', '');
        $('results').innerHTML = r.rows.map(function (s, i) {
          // values are keyed by column header (Role is a built-in label)
          return '<button type="button" class="list-item" role="listitem" onclick="edit(' + i + ')"><span class="name">' + esc(s.employeeName || '(no name)') + '</span>' +
            '<span class="meta">' + esc(s.employeeId || 'no ID') + (s.values.Role ? ' · ' + esc(s.values.Role) : '') + '</span></button>';
        }).join('') || ($('q').value
          ? emptyHtml('⌕', 'No staff found', 'Nobody matches "' + esc($('q').value) + '".')
          : emptyHtml('☺', 'No staff records yet', 'Add people with "+ Add staff", import them from the schedule with "Unknown…", or type them into the staff sheet.'));
      }, function () { $('results').innerHTML = ''; });
    }

    function edit(i) {
      editing = i === null ? null : list.rows[i];
      $('edTitle').textContent = editing ? (editing.employeeName || editing.employeeId) : 'New staff member';
      $('edFields').innerHTML = list.fields.map(function (f, k) {
        var id = 'f' + k;
        var v = editing ? (editing.values[f.label] || '') : '';
        var req = f.key === 'employeeId' || f.key === 'employeeName' || f.required;
        return '<div class="field"><label class="label" for="' + id + '">' + esc(f.label) + (req ? '<span class="req" aria-hidden="true">*</span>' : '') +
          (f.identifier && f.key !== 'employeeId' ? ' ' + badge('', 'ID', 'Identifier: stored as text, unique in this team') : '') + '</label>' +
          '<input type="text" id="' + id + '" data-f="' + esc(f.label) + '" value="' + esc(v) + '"' + (req ? ' required' : '') + (f.identifier ? ' spellcheck="false"' : '') + '></div>';
      }).join('') + '<p class="hint">Identifiers are stored as text (leading zeros are kept) and must be unique in this team.' +
        (editing ? ' Changing the Employee ID does not rewrite already imported shifts.' : '') + '</p>';
      showStatus('', '');
      view('editor');
      focusFirst('edFields');
    }

    function save() {
      clearFieldErrors();
      var values = {}, missing = null;
      document.querySelectorAll('#edFields [data-f]').forEach(function (el) {
        values[el.dataset.f] = el.value;
        if (el.required && !el.value.trim() && !missing) missing = el;
      });
      if (missing) { fieldError(missing.id, 'This field is required.'); missing.focus(); return; }
      call('Saving…', 'apiStaffSave', teamId(), values, editing ? editing.employeeId : '').then(function (r) {
        var msg = (r.created ? 'Added ' : 'Updated ') + r.employeeName + ' (' + r.employeeId + ').';
        search(msg);
      });
    }
    function loadUnknown() {
      call('Looking for unknown employees…', 'apiStaffUnknownCandidates', teamId()).then(function (r) {
        unknown = r;
        showStatus('', '');
        $('unknownList').innerHTML = r.length ? '<div class="check-list" style="max-height:none">' + r.map(function (u, i) {
          if (!u.canAdd) {
            return '<div class="check"><span>' + badge('warn', 'No ID') + ' ' + esc(u.employeeName || '(no name)') +
              '<span class="hint">' + u.shifts + ' shift(s), last ' + esc(u.lastDate) + '. The export has no Employee ID: add this person with "+ Add staff" using exactly the same name to match future imports by name.</span></span></div>';
          }
          return '<label class="check"><input type="checkbox" data-u="' + i + '" checked> <span>' + esc(u.employeeName || '(no name)') + ' · ' + esc(u.employeeId) +
            '<span class="hint">' + u.shifts + ' shift(s), last ' + esc(u.lastDate) + '</span></span></label>';
        }).join('') + '</div>' : emptyHtml('✓', 'Everyone is matched', 'Every employee in this team\'s stored schedule is in the staff sheet.');
        show('addUnknownBtn', r.some(function (u) { return u.canAdd; }));
        view('unknown');
      });
    }
    function addUnknown() {
      var ids = checkedData('u').map(function (i) { return unknown[Number(i)].employeeId; });
      if (!ids.length) { showStatus('warn', 'Tick at least one person.', 'Nobody selected'); return; }
      call('Adding…', 'apiStaffAddUnknown', teamId(), ids).then(function (r) { search('Added ' + r.added.length + ' employee(s).'); });
    }
    function openSheet() { call('Opening the staff sheet…', 'apiOpenTeamSheet', teamId(), 'staff').then(sheetOpened); }
    init();
  </script>
</body>
</html>
