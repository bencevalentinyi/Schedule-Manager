<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Styles') ?>
  <style>
    .layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: var(--gap); align-items: start; }
    .rail { position: sticky; top: 0; }
    .rail .panel > .panel-head { min-height: 32px; }
    .rail .field { margin-bottom: var(--s2); }
    .rail .seg { display: flex; } .rail .seg .btn { flex: 1 1 0; min-width: 0; }
    .day-step { display: grid; grid-template-columns: 32px 1fr 32px; gap: 4px; }
    .day-step .btn.icon svg { width: 14px; height: 14px; }
    #teamList { max-height: 220px; overflow: auto; margin: 0 -2px; padding: 0 2px; }
    .views { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: var(--gap); align-items: start; }
    .views.wide { grid-template-columns: 1fr; }
    .team-figs { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: var(--fs-small); color: var(--text-2); padding: 8px 14px; border-bottom: 1px solid var(--rule); }
    .team-figs b { font: 700 15px/1 var(--figure); color: var(--text); font-variant-numeric: tabular-nums; margin-right: 3px; }
    .team-figs .bad b, .team-figs .bad { color: var(--error); }
    .team-figs .warn b, .team-figs .warn { color: var(--warning); }
    .team-figs .meet b, .team-figs .meet { color: var(--meeting); }
    .panel.team .table-wrap { max-height: none; }
    td .emp { color: var(--text-2); font-size: var(--fs-small); margin-left: 6px; font-variant-numeric: tabular-nums; }
    tr.meeting td { background: var(--meeting-bg); }
    tr.meeting td.time::before { content: ""; display: inline-block; width: 8px; height: 12px; margin-right: 6px; vertical-align: -1px;
      background: repeating-linear-gradient(135deg, var(--meeting) 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1px var(--meeting); }
    .flag-kinds { display: grid; gap: 4px; margin-bottom: var(--s2); }
    .flag-kinds button { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 3px 0; cursor: pointer; text-align: left; font: inherit; color: var(--text); }
    .flag-kinds button:hover .badge { filter: brightness(.94); }
    .flag-kinds b { margin-left: auto; font: 700 15px/1 var(--figure); }
    .flag-people { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--rule); }
    .flag-people li { padding: 5px 0; border-bottom: 1px solid var(--rule); font-size: var(--fs-small); }
    .flag-people li:last-child { border-bottom: 0; }
    .flag-people .when { font: 600 13px var(--figure); font-variant-numeric: tabular-nums; margin-right: 6px; }
    tr.carry td { color: var(--text-3); }
    tr.carry td.time { text-decoration: underline dashed var(--border-strong); text-underline-offset: 3px; }
    td.time { white-space: nowrap; font: 600 14px/1.25 var(--figure); font-variant-numeric: tabular-nums; }
    td.time span { color: var(--text-2); font-weight: 500; }
    .tl { position: relative; height: 18px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--rule); min-width: 160px; }
    .tl .seg-bar { position: absolute; top: 3px; bottom: 3px; background: var(--text); border-radius: 1px; }
    .tl .seg-bar.meeting { background: repeating-linear-gradient(135deg, var(--meeting) 0 3px, var(--meeting-bg) 3px 6px); box-shadow: inset 0 0 0 1px var(--meeting); }
    .tl .seg-bar.carry { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); border: 0; outline: 1px dashed var(--text-3); outline-offset: -1px; }
    .tl-scale { display: flex; justify-content: space-between; font: 500 11px var(--figure); color: var(--text-2); min-width: 160px; }
    .flag-line { display: flex; align-items: center; gap: var(--s2); margin: 0 0 var(--gap); padding: 6px 12px; background: var(--surface); border: 1px solid var(--error); }
    a.person { color: var(--text); font-weight: 700; text-decoration: none; }
    a.person:hover { color: var(--primary); text-decoration: underline; }
    @media (max-width: 900px) {
      /* Phones and tablets: day and view on top, then flags and the schedule; the team choice comes last. */
      .layout { grid-template-columns: 1fr; gap: 0; }
      .rail { display: contents; }
      .rail .panel { margin: 0 0 var(--gap); }
      .rail .rail-day { order: 0; } .rail .rail-view { order: 1; } .rail .rail-flags { order: 2; } .layout > .content { order: 3; } .rail .rail-teams { order: 4; }
    }
    @media (max-width: 620px) { .col-role, .col-type { display: none; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="head-row">
      <div>
        <h1 id="title">Schedule</h1>
        <p class="subtitle">Everyone working on a day, per team, with meetings and flags, read straight from the stored schedule.</p>
      </div>
    </div>
  </header>
  <main class="app-body" id="main">
    <div class="layout">
      <aside class="rail" aria-label="Choose the day and teams">
        <section class="panel rail-day">
          <div class="panel-head"><h2>Day</h2></div>
          <div class="day-step">
            <button type="button" class="btn icon" onclick="step(-1)" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
            <label class="sr-only" for="date">Date</label><input type="date" id="date" onchange="load($('date').value)">
            <button type="button" class="btn icon" onclick="step(1)" aria-label="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
          </div>
          <button type="button" class="btn sm mt-2" onclick="load(today)">Today</button>
        </section>
        <section class="panel rail-view">
          <div class="panel-head"><h2>View</h2></div>
          <div class="seg" role="group" aria-label="View">
            <button type="button" class="btn sm" id="modeList" aria-pressed="true" onclick="setMode('list')">List</button>
            <button type="button" class="btn sm" id="modeTimeline" aria-pressed="false" onclick="setMode('timeline')">Timeline</button>
          </div>
          <div class="field mt-3"><label class="sr-only" for="q">Search</label><input type="search" id="q" placeholder="Name, role, type…" oninput="paint()"></div>
          <label class="check"><input type="checkbox" id="showMeetings" checked onchange="paint()"> Meetings</label>
          <label class="check"><input type="checkbox" id="showCarry" checked onchange="paint()"> Previous / next day</label>
        </section>
        <section class="panel rail-teams">
          <div class="panel-head"><h2>Teams</h2><span class="spacer"></span><span class="note" id="teamCount"></span></div>
          <div id="teamList"></div>
          <div class="cluster mt-2"><button type="button" class="btn sm primary" onclick="applyTeams()">Show</button><button type="button" class="btn sm" onclick="allTeams()">All teams</button></div>
        </section>
        <section class="panel flush rail-flags" id="flagsPanel">
          <div class="panel-head"><h2>Flags</h2><span class="count-tag" id="flagCount"></span></div>
          <div id="flagList" class="pad"></div>
        </section>
      </aside>
      <div class="content">
        <div id="status" aria-live="polite"></div>
        <div id="flagBox"></div>
        <div id="overview"></div>
        <section class="panel" id="hcPanel">
          <div class="panel-head"><h2>Headcount by hour</h2><span class="count-tag" id="hcPeak"></span><span class="spacer"></span><span class="note" id="hcNote"></span></div>
          <div id="hc"></div>
        </section>
        <div id="out"><div class="inline-loading"><span class="spinner" aria-hidden="true"></span>Loading…</div></div>
      </div>
    </div>
  </main>

  <?!= include('ClientCore') ?>
  <script>
    var BOOT = <?!= bootJson ?>;
    var day = null, today = '', flag = BOOT.flag || '', mode = 'list';

    function load(date, teamIds) {
      var ids = teamIds || (day ? day.selected : BOOT.teamIds);
      return call('Loading the schedule…', 'apiWebDay', date === undefined ? BOOT.date : date, ids).then(function (d) {
        day = d; today = d.today;
        remember();
        render();
      });
    }
    function remember() {
      // Keep the date and teams in the address, so the page can be bookmarked and reloaded.
      try { google.script.history.replace(null, { page: 'schedule', date: day.date, teams: day.selected.join(',') }); } catch (e) { /* not in the web app */ }
    }
    function step(k) {
      var d = new Date(day.date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + k);
      load(d.toISOString().substr(0, 10));
    }
    function setMode(m) {
      mode = m;
      $('modeList').setAttribute('aria-pressed', m === 'list' ? 'true' : 'false');
      $('modeTimeline').setAttribute('aria-pressed', m === 'timeline' ? 'true' : 'false');
      paint();
    }
    function applyTeams() { load(day.date, checkedData('team')); }
    function allTeams() { load(day.date, day.teams.map(function (t) { return t.teamId; })); }
    function clearFlag() { flag = ''; paint(); }

    function render() {
      $('date').value = day.date;
      $('title').textContent = day.weekday + ', ' + day.date + (day.date === today ? ' (today)' : '');
      $('teamList').innerHTML = day.teams.map(function (t) {
        return '<label class="check"><input type="checkbox" data-team="' + esc(t.teamId) + '"' + (day.selected.indexOf(t.teamId) >= 0 ? ' checked' : '') + '> ' +
          esc(t.teamName) + (t.active ? '' : ' ' + badge('warn', 'Inactive')) + '</label>';
      }).join('') || '<p class="hint mt-0">No teams yet.</p>';
      $('teamCount').textContent = day.selected.length + ' of ' + day.teams.length;
      paint();
    }

    function matches(r) {
      if (!$('showMeetings').checked && r.meeting) return false;
      if (!$('showCarry').checked && r.carry) return false;
      if (flag && r.flags.indexOf(flag) < 0) return false;
      var q = $('q').value.trim().toLowerCase();
      if (q && (r.name + ' ' + r.employeeId + ' ' + r.role + ' ' + r.type + ' ' + r.flags.join(' ')).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }
    function flagBadges(flags) {
      return flags.map(function (f) {
        var kind = /^Meeting/.test(f) ? 'meeting' : /Overlap|Unknown/.test(f) ? 'bad' : /previous|next day|Outside/.test(f) ? '' : 'warn';
        return badge(kind, f);
      }).join(' ') || '<span class="muted small">OK</span>';
    }
    function personLink(r) { return '<a class="person" href="' + esc(webHref('person', { key: r.key, week: day.date })) + '" target="_top">' + esc(r.name) + '</a>'; }
    function fig(n, label, cls) { return '<span class="' + (cls || '') + '"><b>' + esc(n) + '</b>' + esc(label) + '</span>'; }

    function paint() {
      if (!day) return;
      $('flagBox').innerHTML = flag ? '<div class="flag-line">' + badge('bad', 'Only: ' + flag) + '<span class="spacer"></span><button type="button" class="btn sm" onclick="clearFlag()">Show everyone</button></div>' : '';
      paintHeadcount(day.headcount);
      paintOverview();
      if (!day.views.length) { $('out').innerHTML = '<section class="panel">' + emptyHtml('grid', 'No team selected', 'Tick teams under Teams and press Show.') + '</section>'; return; }
      var timeline = mode === 'timeline';
      var range = day.views.reduce(function (r, v) { return [Math.min(r[0], v.window.from), Math.max(r[1], v.window.to)]; }, [0, 1440]);
      $('out').innerHTML = '<div class="views' + (timeline || day.views.length === 1 ? ' wide' : '') + '">' + day.views.map(function (v) {
        var rows = v.rows.filter(matches);
        var S = v.summary;
        var head = moduleHead(v.teamName, S.shifts, '<span class="note">' + esc(v.hoursLabel) + '</span>' +
          (v.sheet ? '<a class="btn sm" href="' + esc(v.sheet.url) + '" target="_blank" rel="noopener">Open in Sheets ' + iconSvg('external') + '</a>' : '')) +
          '<div class="team-figs">' + fig(S.staff, 'staff') + fig(S.workingHours, 'working hrs') + (S.meetings ? fig(S.meetings, 'meetings', 'meet') : '') +
          fig(S.peak, 'peak') + (S.overlaps ? fig(S.overlaps, 'overlaps', 'bad') : '') + (S.unknown ? fig(S.unknown, 'unknown', 'warn') : '') + '</div>' +
          (v.staffSheetOk ? '' : '<div class="pad">' + alertHtml('warning', 'The staff sheet could not be read', 'Roles and "Unknown employee" are not shown for this team.') + '</div>');
        if (!rows.length) return '<section class="panel flush team">' + head + '<p class="muted pad mb-0">' + (v.rows.length ? 'No one matches the filters.' : 'No shifts on this date.') + '</p></section>';
        var body = rows.map(function (r) {
          var cls = (r.meeting ? 'meeting ' : '') + (r.carry ? 'carry' : '');
          var when = timeline ? '<td>' + bar(r, range) + '</td>' : '';
          return '<tr class="' + cls + '"><td class="time">' + esc(r.start) + ' <span>– ' + esc(r.end) + '</span></td><td>' + personLink(r) +
            (r.employeeId ? '<span class="emp">' + esc(r.employeeId) + '</span>' : '') + '</td>' +
            '<td class="col-role small">' + esc(r.role) + '</td><td class="col-type small">' + esc(r.type) + '</td>' + when +
            '<td class="small">' + flagBadges(r.flags) + '</td></tr>';
        }).join('');
        var scale = timeline ? '<th scope="col"><div class="tl-scale"><span>' + hmOf(range[0]) + '</span><span>' + hmOf((range[0] + range[1]) / 2) + '</span><span>' + hmOf(range[1]) + '</span></div></th>' : '';
        return '<section class="panel flush team">' + head + '<div class="table-wrap"><table class="table"><thead><tr><th scope="col">Time</th><th scope="col">Name</th>' +
          '<th scope="col" class="col-role">Role</th><th scope="col" class="col-type">Type</th>' + scale + '<th scope="col">Flags</th></tr></thead><tbody>' + body +
          '</tbody></table></div>' + (rows.length !== v.rows.length ? '<p class="small muted pad mb-0">Showing ' + rows.length + ' of ' + v.rows.length + '.</p>' : '') + '</section>';
      }).join('') + '</div>';
    }
    function hmOf(m) { m = ((Math.round(m) % 1440) + 1440) % 1440; return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2); }
    function bar(r, range) {
      var span = range[1] - range[0];
      var a = Math.max(r.from, range[0]), b = Math.min(r.to, range[1]);
      if (b <= a) return '<div class="tl"></div>';
      return '<div class="tl" title="' + esc(r.start + ' – ' + r.end) + '"><div class="seg-bar' + (r.meeting ? ' meeting' : '') + (r.carry ? ' carry' : '') +
        '" style="left:' + ((a - range[0]) / span * 100) + '%;width:' + ((b - a) / span * 100) + '%"></div></div>';
    }
    /** Problem flags only: carry-over and outside-hours notes are information, not something to fix. */
    function isProblem(f) { return !/previous|next day|Outside/.test(f); }
    function paintOverview() {
      var T = { shifts: 0, staff: 0, hours: 0, meetings: 0, overlaps: 0, unknown: 0 };
      day.views.forEach(function (v) {
        var S = v.summary;
        T.shifts += +S.shifts || 0; T.staff += +S.staff || 0; T.hours += parseFloat(S.workingHours) || 0;
        T.meetings += +S.meetings || 0; T.overlaps += +S.overlaps || 0; T.unknown += +S.unknown || 0;
      });
      var peak = day.headcount.reduce(function (m, h) { return Math.max(m, h.count); }, 0);
      $('overview').innerHTML = day.views.length ? '<section class="panel flush">' + moduleHead('Day totals', null, '<span class="note">' + day.views.length + ' team(s)</span>') +
        '<div class="stats">' + stat('Shifts', T.shifts) + stat('Staff', T.staff) + stat('Working hrs', Math.round(T.hours * 100) / 100) + stat('Peak', peak) +
        stat('Meetings', T.meetings, T.meetings ? 'meeting' : '') + stat('Overlaps', T.overlaps, T.overlaps ? 'bad' : '') + stat('Unknown', T.unknown, T.unknown ? 'warn' : '') + '</div></section>' : '';
      // Flags: how many of each kind (click to show only those), then who.
      var kinds = {}, people = [];
      day.views.forEach(function (v) {
        v.rows.forEach(function (r) {
          var own = r.flags.filter(isProblem);
          if (!own.length) return;
          own.forEach(function (f) { kinds[f] = (kinds[f] || 0) + 1; });
          people.push({ r: r, team: v.teamName, flags: own });
        });
      });
      var names = Object.keys(kinds);
      $('flagCount').textContent = people.length;
      $('flagCount').classList.toggle('quiet', !people.length);
      $('flagList').innerHTML = names.length ? '<div class="flag-kinds">' + names.map(function (f) {
          return '<button type="button" data-flag="' + esc(f) + '" onclick="onlyFlag(this)" aria-label="Show only ' + esc(f) + '">' + flagBadges([f]) + '<b>' + kinds[f] + '</b></button>';
        }).join('') + '</div><ul class="flag-people">' + people.map(function (p) {
          return '<li><span class="when">' + esc(p.r.start) + '</span>' + personLink(p.r) + ' <span class="muted">' + esc(p.team) + '</span></li>';
        }).join('') + '</ul>'
        : '<p class="muted small mb-0">Nothing to check on this day.</p>';
    }
    function onlyFlag(btn) { flag = btn.getAttribute('data-flag'); paint(); }
    function paintHeadcount(hc) {
      var max = hc.reduce(function (m, h) { return Math.max(m, h.count); }, 0);
      show('hcPanel', max > 0);
      if (!max) return;
      $('hc').innerHTML = headcountHtml(hc);
      $('hcPeak').textContent = max;
      $('hcNote').textContent = 'Peak, shifts of the shown teams';
    }
    if (BOOT.q) $('q').value = BOOT.q;
    load();
  </script>
</body>
</html>
