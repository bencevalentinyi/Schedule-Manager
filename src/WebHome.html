<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Styles') ?>
  <style>
    .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--s3); align-items: start; margin-bottom: var(--s3); }
    .home-grid .panel { margin: 0; }
    .home-grid .wide { grid-column: 1 / -1; }
    a.btn { text-decoration: none; }
    .start { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--s2); margin-bottom: var(--s3); }
    .start a { display: block; padding: 12px 14px; border: 1px solid var(--border); border-left: 3px solid var(--primary); border-radius: var(--radius);
      background: var(--surface); color: var(--text); text-decoration: none; }
    .start a:hover { border-color: var(--primary); }
    .start b { display: block; font-size: 15px; }
    .start span { display: block; color: var(--text-2); font-size: var(--fs-small); margin-top: 2px; }
    .group-title { font-size: var(--fs-small); text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); margin: var(--s4) 0 var(--s2); }
    .tool-list { display: flex; flex-direction: column; gap: 6px; }
    .tool-list a.btn { justify-content: flex-start; }
    details.maint > summary { cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="head-row">
      <div>
        <h1>Home</h1>
        <p class="subtitle" id="subtitle">The same tools as the Schedule Manager menu in Sheets. Schedules, staff sheets and the Dashboard open in Google Sheets.</p>
      </div>
      <span id="versionBadge"></span>
    </div>
  </header>
  <main class="app-body" id="main">
    <div id="status" aria-live="polite"></div>
    <div id="setup"></div>
    <div id="home"><div class="inline-loading"><span class="spinner" aria-hidden="true"></span>Loading…</div></div>
  </main>
  <footer class="app-footer">
    <span class="foot-note" id="who"></span>
    <span class="spacer"></span>
    <button type="button" class="btn" onclick="load()">Reload</button>
  </footer>

  <?!= include('ClientCore') ?>
  <script>
    var BOOT = <?!= bootJson ?>;
    var home = null;

    function load() {
      call('Loading…', 'apiWebHome').then(function (d) { home = d; render(); });
    }
    function pageLink(page, label, cls, params) {
      return '<a class="btn ' + (cls || '') + '" href="' + esc(webHref(page, params)) + '" target="_top">' + esc(label) + '</a>';
    }
    function sheetLink(l, label) {
      return l ? '<a class="btn sm" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(label) + ' ↗</a>' : badge('bad', 'Sheet missing');
    }

    function render() {
      var d = home, s = d.state;
      $('subtitle').textContent = 'Spreadsheet: ' + d.spreadsheetName + '. Schedules, staff sheets and the Dashboard open in Google Sheets.';
      $('versionBadge').innerHTML = badge('', 'v' + d.version);
      $('who').textContent = d.user ? 'Signed in as ' + d.user : '';
      if (!s.initialized || s.needsUpgrade) {
        $('setup').innerHTML = alertHtml('warning', s.needsUpgrade ? 'The spreadsheet needs an upgrade' : 'The spreadsheet is not set up yet',
          'Open Setup to ' + (s.needsUpgrade ? 'upgrade it to this version' : 'create the system sheets') + '. Nothing else works until then.<div class="cluster mt-2">' +
          pageLink('setup', 'Open Setup', 'sm primary') + '</div>');
        $('home').innerHTML = '';
        return;
      }
      $('setup').innerHTML = s.healthy ? '' : alertHtml('warning', 'Some system sheets are missing or incomplete', 'Run Validate structure below, then Setup or Rebuild missing sheets.');

      var last = d.lastImport;
      var lastHtml = last ? kvTable([
        ['File', esc(last.sourceFile)], ['Time', esc(last.timestamp)], ['Teams', esc(last.teams)],
        ['Status', badge(last.status === 'COMMITTED' ? 'ok' : (last.status === 'FAILED' || last.status === 'COMMITTING' ? 'bad' : 'warn'), last.status)]
      ]) : '<p class="muted mb-0">Nothing imported yet.</p>';

      var teams = d.teams.length ? '<div class="table-wrap"><table class="table"><thead><tr><th scope="col">Team</th><th scope="col">Status</th><th scope="col">Sheets</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody>' +
        d.teams.map(function (t) {
          var name = t.status === 'READY' ? '<a href="' + esc(webHref('schedule', { teams: t.teamId })) + '" target="_top">' + esc(t.teamName) + '</a>' : esc(t.teamName);
          return '<tr><td><b>' + name + '</b><div class="small muted">' + esc(t.teamId) + '</div></td>' +
            '<td>' + (t.status === 'READY' ? badge('ok', 'Ready') : badge('bad', t.status)) + ' ' + (t.active ? badge('', 'Active') : badge('warn', 'Inactive')) + '</td>' +
            '<td><div class="cluster">' + sheetLink(t.schedule, 'Schedule') + sheetLink(t.staff, 'Staff') + '</div></td>' +
            '<td class="actions">' + pageLink('team', 'Edit', 'sm', { teamId: t.teamId }) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : emptyHtml('▦', 'No teams yet', 'A team gets its own daily schedule sheet and staff sheet.', pageLink('team', 'Create the first team', 'primary'));

      var start = function (page, title, text) { return '<a href="' + esc(webHref(page)) + '" target="_top"><b>' + esc(title) + '</b><span>' + esc(text) + '</span></a>'; };
      var tools = function (title, items) { return '<section class="panel"><div class="panel-head"><h2>' + esc(title) + '</h2></div><div class="tool-list">' + items.join('') + '</div></section>'; };

      // 1. Start here: the daily work.
      var html = '<div class="start">' +
        start('schedule', 'Today\'s schedule', 'Who works when, per team') +
        start('dashboard', 'Dashboard', 'Totals, overlaps, unknown staff') +
        start('import', 'Import schedule', 'Quinyx export → schedules') +
        start('staff', 'Staff', 'Staff sheets, add and edit people') + '</div>';

      // 2. Status: last import, Monitoring Links and extension cards (e.g. Taxi requests).
      html += '<div class="home-grid">' +
        '<section class="panel"><div class="panel-head"><h2>Last import</h2><span class="spacer"></span>' + pageLink('history', 'History / Undo', 'sm') + '</div>' + lastHtml + '</section>' +
        '<section class="panel"><div class="panel-head"><h2>Monitoring Links</h2></div><p class="small">' + d.linkItems + ' saved item(s).</p><div class="cluster">' +
          '<button type="button" class="btn sm primary" onclick="generateLinks()"' + (d.linkItems ? '' : ' disabled title="No monitoring links or plans saved yet"') + '>Generate all</button>' +
          pageLink('output', 'See output', 'sm') + pageLink('links', 'Edit', 'sm') +
          (d.linksSheet ? sheetLink(d.linksSheet, 'Sheet') : '') + '</div>' +
          (d.linksSheet ? '' : '<p class="small muted mb-0 mt-2">The sheet appears after the first Generate.</p>') + '</section>' +
        (d.extensions || []).map(function (c) {
          return '<section class="panel"><div class="panel-head"><h2>' + esc(c.title) + '</h2></div>' +
            (c.stats && c.stats.length ? '<div class="stats">' + c.stats.map(function (x) { return stat(x.label, x.value, x.cls); }).join('') + '</div>' : '') +
            (c.text ? '<p class="small">' + esc(c.text) + '</p>' : '') +
            '<div class="cluster">' + (c.links || []).map(function (l, i) { return pageLink(l.page, l.label, 'sm' + (i ? '' : ' primary')); }).join('') +
            (c.sheets || []).map(function (x) { return sheetLink(x, x.label); }).join('') + '</div></section>';
        }).join('') + '</div>';

      // 3. Teams.
      html += '<section class="panel"><div class="panel-head"><h2>Teams</h2><span class="spacer"></span>' + pageLink('teams', 'Manage teams', 'sm') + pageLink('team', '+ New team', 'sm') + '</div>' + teams + '</section>';

      // 4. All tools, by topic.
      html += '<h2 class="group-title">All tools</h2><div class="home-grid">' +
        tools('Schedules', [pageLink('schedule', 'Schedule', 'sm'), pageLink('import', 'Import Quinyx export', 'sm'), pageLink('history', 'Import history / Undo', 'sm'), pageLink('viewer', 'Sheet schedule viewer', 'sm')]) +
        tools('Staff', [pageLink('staff', 'Staff', 'sm'), pageLink('ids', 'Import staff data (IDs, emails…)', 'sm'), pageLink('fields', 'Configure staff fields', 'sm')]) +
        tools('Settings', [pageLink('settings', 'Display settings (theme)', 'sm'), pageLink('teams', 'Teams', 'sm'), pageLink('setup', 'Setup', 'sm'), pageLink('help', 'About / Help', 'sm')]) +
        '</div>';

      // 5. Maintenance, folded away.
      html += '<section class="panel"><details class="maint"><summary>Maintenance</summary><p class="small muted">Checks and repairs. Nothing here deletes data.</p><div class="cluster">' +
          '<button type="button" class="btn sm" onclick="maintain(\'structure\')">Validate structure</button>' +
          '<button type="button" class="btn sm" onclick="maintain(\'data\')">Validate data</button>' +
          '<button type="button" class="btn sm" onclick="maintain(\'refresh\')">Refresh schedule data</button>' +
          '<button type="button" class="btn sm" onclick="maintain(\'repair\')">Repair formatting</button>' +
          '<button type="button" class="btn sm" onclick="maintain(\'rebuild\')">Rebuild missing sheets</button>' +
          '</div><div id="report" class="mt-3"></div></details></section>';

      $('home').innerHTML = html;
    }

    function generateLinks() {
      call('Building all links and plans…', 'apiLinksGenerateAll', '').then(function (r) {
        showStatus('ok', r.results.map(function (x) { return esc(x.name) + ': ' + x.count + (x.kind === 'PLAN' ? ' line(s)' : ' agent(s)'); }).join('<br>') +
          '<div class="cluster mt-2"><button type="button" class="btn sm" onclick="load()">Reload</button></div>', r.results.length + ' item(s) written to "' + esc(r.sheet) + '"');
        if (!home.linksSheet) load();
      });
    }
    function maintain(action) {
      call('Working…', 'apiWebMaintenance', action).then(function (r) {
        var rep = r.report || {};
        var clean = !(rep.fatal && rep.fatal.length) && !(rep.warnings && rep.warnings.length);
        $('report').innerHTML = '<h3>' + esc(r.title) + '</h3>' + (clean ? alertHtml('success', 'No problems found', '') : '') + renderReport(rep);
      });
    }
    load();
  </script>
</body>
</html>
