<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Styles') ?>
  <style>
    a.btn { text-decoration: none; }
    .actions-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--s2); }
    .actions-row .btn { justify-content: flex-start; height: 40px; }
    .tool-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0 var(--s4); }
    .tool-list a { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--rule); color: var(--text); text-decoration: none; font-weight: 600; }
    .tool-list a::after { content: ""; width: 6px; height: 6px; border-top: 1.6px solid var(--text-3); border-right: 1.6px solid var(--text-3); transform: rotate(45deg); }
    .tool-list a:hover { color: var(--primary); }
    .tool-list a:hover::after { border-color: var(--primary); }
    .big-fig { font: 700 40px/1 var(--figure); font-variant-numeric: tabular-nums; }
    td.team-name a { color: var(--text); text-decoration: none; }
    td.team-name a:hover { color: var(--primary); text-decoration: underline; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="head-row">
      <div>
        <h1>Home</h1>
        <p class="subtitle" id="subtitle">The same tools as the Schedule Manager menu in Sheets. Schedules, staff sheets and the Dashboard open in Google Sheets.</p>
      </div>
      <span id="versionBadge"></span>
    </div>
  </header>
  <main class="app-body" id="main">
    <div id="status" aria-live="polite"></div>
    <div id="setup"></div>
    <div id="home"><div class="inline-loading"><span class="spinner" aria-hidden="true"></span>Loading…</div></div>
  </main>
  <footer class="app-footer">
    <span class="foot-note" id="who"></span>
    <span class="spacer"></span>
    <button type="button" class="btn" onclick="load()">Reload</button>
  </footer>

  <?!= include('ClientCore') ?>
  <script>
    var BOOT = <?!= bootJson ?>;
    var home = null;

    function load() {
      call('Loading…', 'apiWebHome').then(function (d) { home = d; render(); });
    }
    function pageLink(page, label, cls, params) {
      return '<a class="btn ' + (cls || '') + '" href="' + esc(webHref(page, params)) + '" target="_top">' + esc(label) + '</a>';
    }
    function toolLink(page, label) { return '<a href="' + esc(webHref(page)) + '" target="_top">' + esc(label) + '</a>'; }
    function sheetLink(l, label) {
      return l ? '<a class="btn sm" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(label) + ' ' + iconSvg('external') + '</a>' : badge('bad', 'Sheet missing');
    }

    function render() {
      var d = home, s = d.state;
      $('subtitle').textContent = 'Spreadsheet: ' + d.spreadsheetName + '. Schedules, staff sheets and the Dashboard open in Google Sheets.';
      $('versionBadge').innerHTML = badge('', 'v' + d.version);
      $('who').textContent = d.user ? 'Signed in as ' + d.user : '';
      if (!s.initialized || s.needsUpgrade) {
        $('setup').innerHTML = alertHtml('warning', s.needsUpgrade ? 'The spreadsheet needs an upgrade' : 'The spreadsheet is not set up yet',
          'Open Setup to ' + (s.needsUpgrade ? 'upgrade it to this version' : 'create the system sheets') + '. Nothing else works until then.<div class="cluster mt-2">' +
          pageLink('setup', 'Open Setup', 'sm primary') + '</div>');
        $('home').innerHTML = '';
        return;
      }
      $('setup').innerHTML = s.healthy ? '' : alertHtml('warning', 'Some system sheets are missing or incomplete', 'Run Validate structure below, then Setup or Rebuild missing sheets.');

      var last = d.lastImport;
      var lastHtml = last ? kvTable([
        ['File', esc(last.sourceFile)], ['Time', esc(last.timestamp)], ['Teams', esc(last.teams)],
        ['Status', badge(last.status === 'COMMITTED' ? 'ok' : (last.status === 'FAILED' || last.status === 'COMMITTING' ? 'bad' : 'warn'), last.status)]
      ]) : '<p class="muted mb-0">Nothing imported yet.</p>';

      var teams = d.teams.length ? '<div class="table-wrap auto"><table class="table"><thead><tr><th scope="col">Team</th><th scope="col">Status</th><th scope="col">Sheets</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody>' +
        d.teams.map(function (t) {
          var name = t.status === 'READY' ? '<a href="' + esc(webHref('schedule', { teams: t.teamId })) + '" target="_top">' + esc(t.teamName) + '</a>' : esc(t.teamName);
          return '<tr><td class="team-name"><b>' + name + '</b><div class="small muted">' + esc(t.teamId) + '</div></td>' +
            '<td>' + (t.status === 'READY' ? badge('ok', 'Ready') : badge('bad', t.status)) + ' ' + (t.active ? badge('', 'Active') : badge('warn', 'Inactive')) + '</td>' +
            '<td><div class="cluster">' + sheetLink(t.schedule, 'Schedule') + sheetLink(t.staff, 'Staff') + '</div></td>' +
            '<td class="actions">' + pageLink('team', 'Edit', 'sm', { teamId: t.teamId }) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="pad">' + emptyHtml('grid', 'No teams yet', 'A team gets its own daily schedule sheet and staff sheet.', pageLink('team', 'Create the first team', 'primary')) + '</div>';

      $('home').innerHTML = '<div class="mosaic">' +
        '<section class="panel w8">' + moduleHead('Quick actions') + '<div class="actions-row">' +
          pageLink('schedule', 'Today\'s schedule', 'primary') + pageLink('dashboard', 'Dashboard') + pageLink('import', 'Import Quinyx export') +
          '<button type="button" class="btn" onclick="generateLinks()"' + (d.linkItems ? '' : ' disabled title="No monitoring links or plans saved yet"') + '>Generate monitoring links</button>' +
          pageLink('history', 'Import history / Undo') + pageLink('staff', 'Staff') + '</div></section>' +
        '<section class="panel w4">' + moduleHead('Last import') + lastHtml + '</section>' +
        '<section class="panel flush w8">' + moduleHead('Teams', d.teams.length, pageLink('teams', 'Manage teams', 'sm') + pageLink('team', 'New team', 'sm')) + teams + '</section>' +
        '<section class="panel w4">' + moduleHead('Monitoring Links', d.linkItems) + '<p class="small">' + (d.linkItems ? d.linkItems + ' saved link(s) and plan(s).' : 'No links or plans saved yet.') + '</p><div class="cluster">' +
          pageLink('links', 'Edit links and plans', 'sm') + pageLink('output', 'See output', 'sm') + (d.linksSheet ? sheetLink(d.linksSheet, 'Monitoring Links sheet') : '<span class="small muted">The sheet appears after the first Generate.</span>') + '</div></section>' +
        '<section class="panel w6">' + moduleHead('More tools') + '<div class="tool-list">' +
          toolLink('viewer', 'Sheet schedule viewer') + toolLink('ids', 'Import staff data') + toolLink('fields', 'Configure staff fields') +
          toolLink('settings', 'Display settings') + toolLink('setup', 'Setup') + toolLink('help', 'About / Help') + '</div></section>' +
        '<section class="panel w6">' + moduleHead('Maintenance') + '<div class="cluster">' +
          '<button type="button" class="btn sm" onclick="maintain(\'structure\')">Validate structure</button>' +
          '<button type="button" class="btn sm" onclick="maintain(\'data\')">Validate data</button>' +
          '<button type="button" class="btn sm" onclick="maintain(\'refresh\')">Refresh schedule data</button>' +
          '<button type="button" class="btn sm" onclick="maintain(\'repair\')">Repair formatting</button>' +
          '<button type="button" class="btn sm" onclick="maintain(\'rebuild\')">Rebuild missing sheets</button>' +
          '</div><div id="report" class="mt-3"></div></section>' +
        '</div>';
    }

    function generateLinks() {
      call('Building all links and plans…', 'apiLinksGenerateAll', '').then(function (r) {
        showStatus('ok', r.results.map(function (x) { return esc(x.name) + ': ' + x.count + (x.kind === 'PLAN' ? ' line(s)' : ' agent(s)'); }).join('<br>') +
          '<div class="cluster mt-2"><button type="button" class="btn sm" onclick="load()">Reload</button></div>', r.results.length + ' item(s) written to "' + esc(r.sheet) + '"');
        if (!home.linksSheet) load();
      });
    }
    function maintain(action) {
      call('Working…', 'apiWebMaintenance', action).then(function (r) {
        var rep = r.report || {};
        var clean = !(rep.fatal && rep.fatal.length) && !(rep.warnings && rep.warnings.length);
        $('report').innerHTML = '<h3>' + esc(r.title) + '</h3>' + (clean ? alertHtml('success', 'No problems found', '') : '') + renderReport(rep);
      });
    }
    load();
  </script>
</body>
</html>
