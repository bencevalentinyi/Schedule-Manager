<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Styles') ?>
  <style> td.actions { white-space: nowrap; } td.actions .btn + .btn { margin-left: 4px; } </style>
</head>
<body>
  <header class="app-header">
    <h1>Manage Existing Teams</h1>
    <p class="subtitle">Edit settings, activate or deactivate, rebuild missing sheets, or delete a team. Deleting never removes stored schedule history.</p>
  </header>
  <main class="app-body" id="main">
    <div id="status" aria-live="polite"></div>
    <div class="toolbar">
      <div class="search"><label class="sr-only" for="q">Search teams</label><input type="search" id="q" placeholder="Search teams" oninput="render()"></div>
      <span class="small muted" id="count"></span>
    </div>
    <div id="deleteBox" class="hidden"></div>
    <div id="teams"><div class="inline-loading"><span class="spinner" aria-hidden="true"></span>Loading teams…</div></div>
  </main>
  <footer class="app-footer">
    <button type="button" class="btn" onclick="closeDialog()">Close</button>
    <span class="spacer"></span>
    <button type="button" class="btn" onclick="load()">Reload</button>
    <button type="button" class="btn primary" onclick="call('Opening the team wizard…', 'apiShowTeamDialog', '')">Create new team</button>
  </footer>

  <?!= include('ClientCore') ?>
  <script>
    var BOOT = <?!= bootJson ?>;
    var teams = [];

    function load() {
      call('Loading teams…', 'apiListTeams').then(function (list) { teams = list; render(); });
    }

    function render() {
      if (!teams.length) {
        $('count').textContent = '';
        $('teams').innerHTML = emptyHtml('▦', 'No teams yet', 'A team gets its own daily schedule sheet and staff sheet.',
          '<button type="button" class="btn primary" onclick="call(\'Opening the team wizard…\', \'apiShowTeamDialog\', \'\')">Create the first team</button>');
        return;
      }
      var q = $('q').value.trim().toLowerCase();
      var shown = teams.map(function (t, i) { return { t: t, i: i }; }).filter(function (x) {
        return !q || (x.t.teamName + ' ' + x.t.teamId).toLowerCase().indexOf(q) >= 0;
      });
      $('count').textContent = shown.length === teams.length ? teams.length + ' team(s)' : shown.length + ' of ' + teams.length + ' team(s)';
      if (!shown.length) { $('teams').innerHTML = emptyHtml('⌕', 'No team matches "' + $('q').value + '"', 'Clear the search to see all teams.'); return; }
      $('teams').innerHTML = '<div class="table-wrap tall"><table class="table"><thead><tr><th scope="col">Team</th><th scope="col">Status</th><th scope="col">Schedule</th><th scope="col">Staff sheet</th><th scope="col">Shift types</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody>' +
        shown.map(function (x) {
          var t = x.t, i = x.i;
          var st = (t.status === 'READY' ? badge('ok', 'Ready') : badge('bad', t.status)) + ' ' + (t.active ? badge('', 'Active') : badge('warn', 'Inactive'));
          if (t.lastError) st += '<div class="small" style="color:var(--error)">' + esc(t.lastError) + '</div>';
          var sched = (t.hasScheduleSheet ? '<a href="#" onclick="openSheet(' + i + ',\'schedule\');return false">' + esc(t.scheduleSheet) + '</a>' : badge('bad', 'Sheet missing')) +
            '<div class="small muted">' + esc(t.hoursLabel) + '</div>';
          var staff = t.hasStaffSheet ? '<a href="#" onclick="openSheet(' + i + ',\'staff\');return false">' + esc(t.staffSheet) + '</a>' : badge('bad', 'Sheet missing');
          var imp = '<div class="small"><span class="muted">Shift types:</span> ' + esc(t.shiftTypes) + '</div><div class="small">' +
            (t.meetings === 'meetings off' ? '<span class="muted">Meetings: off</span>' : badge('meeting', 'Meetings') + ' ' + esc(t.meetings.replace(/^meetings: /, ''))) + '</div>';
          return '<tr><td><b>' + esc(t.teamName) + '</b><div class="small muted">' + esc(t.teamId) + '</div></td>' +
            '<td>' + st + '</td><td class="small">' + sched + '</td><td class="small">' + staff + '</td><td class="wrap">' + imp + '</td>' +
            '<td class="actions"><button type="button" class="btn sm primary" onclick="edit(' + i + ')" aria-label="Edit ' + esc(t.teamName) + '">Edit</button>' +
            '<button type="button" class="btn sm" onclick="toggle(' + i + ')">' + (t.active ? 'Deactivate' : 'Activate') + '</button>' +
            '<button type="button" class="btn sm" onclick="rebuild(' + i + ')" title="Recreates missing sheets and reapplies formatting">Rebuild</button>' +
            '<button type="button" class="btn sm danger" onclick="askDelete(' + i + ')" aria-label="Delete ' + esc(t.teamName) + '">Delete</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    function edit(i) { call('Opening…', 'apiShowTeamDialog', teams[i].teamId); }
    function openSheet(i, kind) { call('Opening…', 'apiOpenTeamSheet', teams[i].teamId, kind); }
    function toggle(i) {
      var t = teams[i];
      call('Saving…', 'apiSetTeamActive', t.teamId, !t.active).then(function () {
        showStatus('ok', '', t.teamName + (t.active ? ' was deactivated.' : ' was activated.')); load();
      });
    }
    function rebuild(i) {
      call('Rebuilding sheets…', 'apiRebuildTeam', teams[i].teamId).then(function (r) {
        showStatus('ok', '<ul>' + r.messages.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>', 'Sheets rebuilt for ' + teams[i].teamName); load();
      });
    }
    function askDelete(i) {
      var t = teams[i];
      askConfirm('deleteBox', {
        title: 'Delete team "' + t.teamName + '"?',
        html: 'The team is removed from the registry. Its schedule records stay in <code>_SCHEDULE_DATA</code> as history. This cannot be undone from the menu.',
        extraHtml: '<label class="check mt-2"><input type="checkbox" id="delSheets"> <span>Also delete its schedule sheet and staff sheet' +
          ' <span class="hint">Staff records in a deleted sheet cannot be recovered.</span></span></label>',
        typeToConfirm: t.teamName,
        confirmLabel: 'Delete team',
        onConfirm: function (typed) {
          call('Deleting…', 'apiDeleteTeam', t.teamId, typed, $('delSheets').checked).then(function (r) {
            closeConfirm('deleteBox');
            showStatus('ok', esc(r.note), 'Deleted ' + r.deletedTeam + (r.deletedSheets.length ? ' and sheets ' + r.deletedSheets.join(', ') : ''));
            load();
          });
        }
      });
    }
    load();
  </script>
</body>
</html>
