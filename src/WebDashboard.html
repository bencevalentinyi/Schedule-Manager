<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Styles') ?>
  <style>
    .toolbar input[type=date] { width: auto; }
    .btn.icon svg { width: 14px; height: 14px; }
    .spark { display: flex; align-items: flex-end; gap: 1px; height: 22px; width: 96px; }
    .spark i { flex: 1 1 0; background: var(--text); border-radius: 1px 1px 0 0; }
    .spark i.peak { background: var(--primary); }
    table.table td.num { font: 700 15px/1.2 var(--figure); font-variant-numeric: tabular-nums; }
    td.num a { text-decoration: none; }
    td.num a:hover { text-decoration: underline; }
    tr.inactive td { color: var(--text-3); }
    a.btn { text-decoration: none; }
    @media (max-width: 620px) { .col-spark, .col-import, .col-changes { display: none; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="head-row">
      <div>
        <h1 id="title">Dashboard</h1>
        <p class="subtitle">Every team's day in numbers: the same figures as the daily sheets and the Dashboard sheet. Click a number to see those people.</p>
      </div>
    </div>
  </header>
  <main class="app-body" id="main">
    <div class="toolbar">
      <button type="button" class="btn icon" onclick="step(-1)" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <label class="sr-only" for="date">Date</label><input type="date" id="date" onchange="load($('date').value)">
      <button type="button" class="btn icon" onclick="step(1)" aria-label="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <button type="button" class="btn" onclick="load(data.today)">Today</button>
      <span class="spacer"></span>
      <button type="button" class="btn" onclick="load(data.date)">Reload</button>
    </div>
    <div id="status" aria-live="polite"></div>
    <div id="out"><div class="inline-loading"><span class="spinner" aria-hidden="true"></span>Loading…</div></div>
  </main>

  <?!= include('ClientCore') ?>
  <script>
    var BOOT = <?!= bootJson ?>;
    var data = null;

    function load(date) {
      return call('Loading the dashboard…', 'apiWebDashboard', date === undefined ? BOOT.date : date).then(function (d) {
        data = d;
        try { google.script.history.replace(null, { page: 'dashboard', date: d.date }); } catch (e) { /* not in the web app */ }
        render();
      });
    }
    function step(k) { var d = new Date(data.date + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + k); load(d.toISOString().substr(0, 10)); }
    function sched(teamId, flag) { return webHref('schedule', { date: data.date, teams: teamId, flag: flag || '' }); }
    function num(v, href, cls) {
      return v ? '<a href="' + esc(href) + '" target="_top"' + (cls ? ' style="color:var(--' + cls + ')"' : '') + '>' + esc(v) + '</a>' : '<span class="muted">0</span>';
    }
    function spark(hc) {
      var max = hc.reduce(function (m, h) { return Math.max(m, h.count); }, 0);
      if (!max) return '';
      return '<div class="spark" aria-hidden="true">' + hc.map(function (h) { return '<i' + (h.count === max ? ' class="peak"' : '') + ' style="height:' + Math.max(2, h.count / max * 100) + '%"></i>'; }).join('') + '</div>';
    }

    function render() {
      var d = data, T = d.totals;
      $('date').value = d.date;
      $('title').textContent = 'Dashboard · ' + d.weekday + ', ' + d.date + (d.date === d.today ? ' (today)' : '');
      var all = d.teams.filter(function (t) { return t.active && t.status === 'READY'; }).map(function (t) { return t.teamId; }).join(',');
      var totals = '<div class="stats">' + stat('Shifts', T.shifts) + stat('Staff', T.staff) + stat('Working hrs', T.workingHours) +
        stat('Meetings', T.meetings, T.meetings ? 'meeting' : '') + stat('Overlaps', T.overlaps, T.overlaps ? 'bad' : '') + stat('Unknown', T.unknown, T.unknown ? 'warn' : '') + '</div>';
      var rows = d.teams.map(function (t) {
        var S = t.summary, ready = t.status === 'READY';
        return '<tr class="' + (t.active ? '' : 'inactive') + '"><td><b>' + (ready ? '<a href="' + esc(sched(t.teamId)) + '" target="_top">' + esc(t.teamName) + '</a>' : esc(t.teamName)) + '</b>' +
          '<div class="small">' + (ready ? '' : badge('bad', t.status) + ' ') + (t.active ? '' : badge('warn', 'Inactive')) + '</div></td>' +
          '<td class="num">' + (ready ? num(S.shifts, sched(t.teamId)) : '—') + '</td><td class="num">' + S.staff + '</td><td class="num">' + esc(S.workingHours) + '</td>' +
          '<td class="num">' + S.peak + '</td><td class="col-spark">' + spark(t.headcount) + '</td>' +
          '<td class="num">' + num(S.overlaps, sched(t.teamId, 'Overlap'), 'error') + '</td><td class="num">' + num(S.unknown, sched(t.teamId, 'Unknown employee'), 'warning') + '</td>' +
          '<td class="col-import small">' + (t.lastImport ? esc(t.lastImport.timestamp) + '<div>' + badge(t.lastImport.status === 'COMMITTED' ? 'ok' : 'warn', t.lastImport.status) + '</div>' : '<span class="muted">never</span>') + '</td>' +
          '<td>' + (t.sheet ? '<a class="btn sm" href="' + esc(t.sheet.url) + '" target="_blank" rel="noopener">Sheet ' + iconSvg('external') + '</a>' : '') + '</td></tr>';
      }).join('');
      var table = d.teams.length ? '<div class="table-wrap auto"><table class="table"><thead><tr><th scope="col">Team</th><th scope="col" class="num">Shifts</th><th scope="col" class="num">Staff</th>' +
        '<th scope="col" class="num">Hours</th><th scope="col" class="num">Peak</th><th scope="col" class="col-spark">By hour</th><th scope="col" class="num">Overlaps</th><th scope="col" class="num">Unknown</th>' +
        '<th scope="col" class="col-import">Last import</th><th scope="col"><span class="sr-only">Sheet</span></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : emptyHtml('grid', 'No teams yet', 'Create a team first.', '<a class="btn primary" href="' + esc(webHref('team')) + '" target="_top">Create a team</a>');
      var max = d.headcount.reduce(function (m, h) { return Math.max(m, h.count); }, 0);
      var hc = '<section class="panel w7">' + moduleHead('Headcount by hour, all active teams', max,
          all ? '<a class="btn sm" href="' + esc(webHref('schedule', { date: d.date, teams: all })) + '" target="_top">Everyone working</a>' : '') +
        (max ? headcountHtml(d.headcount) : '<p class="muted mb-0">No one is scheduled on this day.</p>') + '</section>';
      var imports = '<section class="panel flush w5">' + moduleHead('Recent imports', d.imports.length,
          '<a class="btn sm" href="' + esc(webHref('history')) + '" target="_top">Import history</a>') +
        (d.imports.length ? '<div class="table-wrap"><table class="table"><thead><tr><th scope="col">Time</th><th scope="col">File and teams</th><th scope="col" class="col-changes">Changes</th><th scope="col">Status</th></tr></thead><tbody>' +
        d.imports.map(function (e) {
          return '<tr><td class="small nowrap">' + esc(e.timestamp) + '</td><td class="small wrap"><b>' + esc(e.sourceFile) + '</b><div class="muted">' + esc(e.teams) + '</div></td>' +
            '<td class="small nowrap col-changes">+' + e.inserted + ' · ~' + e.updated + ' · −' + e.removed + '</td><td>' + badge(e.status === 'COMMITTED' ? 'ok' : (e.status === 'UNDONE' ? '' : 'warn'), e.status) + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<p class="muted pad mb-0">Nothing imported yet.</p>') + '</section>';
      $('out').innerHTML = '<div class="mosaic"><section class="panel flush">' + moduleHead('Day totals', null, '<span class="note">All teams</span>') + totals + '</section>' +
        '<section class="panel flush">' + moduleHead('Teams', d.teams.length, '<span class="note">Click a number to see those people</span>') + table + '</section>' +
        hc + imports + '</div>';
    }
    load();
  </script>
</body>
</html>
