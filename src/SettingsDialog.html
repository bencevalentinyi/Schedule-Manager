<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Styles') ?>
</head>
<body>
  <header class="app-header">
    <h1>Display Settings</h1>
    <p class="subtitle">Apply to all teams. Per-team settings (operating hours, shift types) are under Manage Existing Teams.</p>
  </header>
  <main class="app-body" id="main">
    <div id="status" aria-live="polite"></div>
    <div id="fields"></div>
  </main>
  <footer class="app-footer">
    <button type="button" class="btn" onclick="closeDialog()">Close</button>
    <span class="spacer"></span>
    <button type="button" class="btn primary" onclick="saveSettings()">Save settings</button>
  </footer>

  <?!= include('ClientCore') ?>
  <script>
    var BOOT = <?!= bootJson ?>;
    var data = null;

    function load() {
      call('Loading settings…', 'apiGetSettings').then(function (d) {
        data = d;
        $('fields').innerHTML = d.definitions.map(field).join('');
      });
    }

    /** "SHOW_CARRY_OVER" → "Show carry over" */
    function humanize(key) { var s = key.toLowerCase().replace(/_/g, ' '); return s.charAt(0).toUpperCase() + s.slice(1); }
    function field(def) {
      var v = data.values[def.key] === undefined ? def.defaultValue : data.values[def.key];
      var id = 's_' + def.key, input;
      if (def.key === 'UI_THEME') {
        input = '<select id="' + id + '" data-key="' + def.key + '">' +
          options(def.options.map(function (k) { return { k: k, l: def.optionLabels[k] || k }; }), 'k', 'l', v) + '</select>';
      }
      else if (def.options) input = '<select id="' + id + '" data-key="' + def.key + '">' + options(def.options, null, null, v) + '</select>';
      else if (def.isBoolean) input = '<select id="' + id + '" data-key="' + def.key + '">' + options([{ k: 'TRUE', l: 'Yes' }, { k: 'FALSE', l: 'No' }], 'k', 'l', String(v).toUpperCase() === 'TRUE' ? 'TRUE' : 'FALSE') + '</select>';
      else input = '<input type="text" id="' + id + '" data-key="' + def.key + '" value="' + esc(v) + '">';
      return '<div class="field"><label class="label" for="' + id + '">' + esc(humanize(def.key)) + '</label>' + input +
        '<p class="hint">' + esc(def.description) + '</p></div>';
    }

    function saveSettings() {
      var updates = {};
      document.querySelectorAll('[data-key]').forEach(function (el) { updates[el.dataset.key] = el.value; });
      call('Saving and reapplying formatting…', 'apiSaveSettings', updates).then(function (r) {
        showStatus('ok', r.changed.length ? 'Changed: ' + esc(r.changed.join(', ')) + (r.reformatted ? '. Formatting was reapplied to all team sheets.' : '.') +
          (r.changed.indexOf('UI_THEME') >= 0 ? ' The sheets and the Dashboard now use the new theme; close and reopen dialogs and sidebars to see it there too.' : '') : '',
          r.changed.length ? 'Settings saved' : 'No changes to save');
        r.changed.forEach(function (k) { data.values[k] = updates[k]; });
      });
    }
    load();
  </script>
</body>
</html>
