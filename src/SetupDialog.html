<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Styles') ?>
</head>
<body>
  <header class="app-header">
    <div class="head-row">
      <div>
        <h1>Setup / Configure Spreadsheet</h1>
        <p class="subtitle">Creates or repairs the internal sheets and configuration. Safe to run any number of times: existing sheets, schedules and settings are never overwritten.</p>
      </div>
      <span id="versionBadge"></span>
    </div>
  </header>
  <main class="app-body" id="main">
    <div id="conn" class="small" aria-live="polite"></div>
    <div id="status" aria-live="polite"></div>
    <div id="result"></div>
    <div id="state"><div class="inline-loading"><span class="spinner" aria-hidden="true"></span>Inspecting the spreadsheet…</div></div>
  </main>
  <footer class="app-footer">
    <button type="button" class="btn" onclick="closeDialog()">Close</button>
    <span class="spacer"></span>
    <button type="button" class="btn hidden" id="validateBtn" onclick="validate()">Validate structure</button>
    <button type="button" class="btn hidden" id="teamBtn" onclick="createTeam()">Create first team</button>
    <button type="button" class="btn primary" id="initBtn" onclick="init()" disabled>Please wait…</button>
  </footer>

  <?!= include('ClientCore') ?>
  <script>
    var BOOT = <?!= bootJson ?>;
    var state = null;

    function load() {
      // Render immediately from the state passed by the server, then test the dialog → script connection.
      if (BOOT.state) { state = BOOT.state; render(); }
      else call('Inspecting spreadsheet…', 'apiGetSetupState').then(function (s) { state = s; render(); });
      testConnection();
    }

    function testConnection() {
      var answered = false;
      $('conn').innerHTML = '<div class="inline-loading" style="padding:0 0 12px"><span class="spinner" aria-hidden="true"></span>Testing the connection between this dialog and the script…</div>';
      var t = setTimeout(function () {
        if (answered) return;
        $('conn').innerHTML = alertHtml('error', 'This dialog cannot reach the script, so its buttons cannot work', '', [
          'Most common cause: several Google accounts are signed in to this browser. Open the spreadsheet in a private window signed in to only this account.',
          'Or the browser blocks third-party cookies for Google: allow cookies for [*.]googleusercontent.com and [*.]google.com, or try another browser.',
          'Workaround for setup only: in the Apps Script editor select setupNow and click Run.']);
      }, 15000);
      try {
        google.script.run
          .withSuccessHandler(function () { answered = true; clearTimeout(t); $('conn').innerHTML = '<p class="small" style="color:var(--success)">✓ Connected to the script.</p>'; })
          .withFailureHandler(function (e) {
            answered = true; clearTimeout(t);
            $('conn').innerHTML = alertHtml('error', 'The dialog could not reach the script', esc(e && e.message || e) +
              '<div class="small mt-2">If several Google accounts are signed in, open the spreadsheet in a private window signed in to only this account.</div>');
          })
          .apiPing();
      } catch (err) {
        answered = true; clearTimeout(t);
        $('conn').innerHTML = alertHtml('error', 'google.script.run is not available', esc(err.message));
      }
    }

    function render() {
      var s = state;
      var needsUpgrade = s.needsUpgrade !== undefined ? s.needsUpgrade : (s.initialized && s.version !== s.codeVersion);
      var head;
      if (!s.initialized) head = alertHtml('info', 'This spreadsheet has not been initialized yet', 'Initialize creates the internal sheets, the default configuration, a starter team type and the import profiles.');
      else if (needsUpgrade) head = alertHtml('warning', 'Upgrade required', 'This spreadsheet is on version ' + esc(s.version || '1.0.0') + ', the code is version ' + esc(s.codeVersion) +
        '. <b>Upgrade</b> adds the new columns, settings and sheets. Existing teams, staff, schedules and history are kept, and running it again changes nothing.');
      else if (!s.healthy) head = alertHtml('warning', 'Some internal sheets or columns are missing', 'Repair recreates only what is missing. Existing data is untouched.');
      else head = alertHtml('success', 'The spreadsheet is configured', 'Version ' + esc(s.version) + (s.version !== s.codeVersion ? ' (code ' + esc(s.codeVersion) + ', compatible — running Repair records the new version)' : '') +
        ' · ' + s.teamCount + ' team(s). Running Repair again is harmless. Other maintenance actions are under Schedule Manager → Maintenance.');
      $('versionBadge').innerHTML = badge('', 'Code ' + s.codeVersion);

      var rows = s.sheets.map(function (x) {
        var st = !x.exists ? badge('bad', 'Missing') : (x.missingColumns.length ? badge('warn', 'Missing columns') + '<div class="small muted mt-2">' + esc(x.missingColumns.join(', ')) + '</div>' : badge('ok', 'OK'));
        return '<tr><td class="nowrap"><code>' + esc(x.name) + '</code></td><td>' + st + '</td><td class="wrap muted">' + esc(x.purpose) + '</td></tr>';
      }).join('');
      $('state').innerHTML = head + '<div class="section-title"><h2>Internal sheets</h2><span class="count">' + s.sheets.length + '</span></div>' +
        '<div class="table-wrap auto"><table class="table"><thead><tr><th scope="col">Sheet</th><th scope="col">Status</th><th scope="col">Purpose</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<p class="hint mt-2">Internal sheets start with "_". They are protected with a warning only; hiding or protecting them is not a security boundary — anyone with edit access can change them.</p>';
      var btn = $('initBtn');
      btn.disabled = false;
      btn.textContent = !s.initialized ? 'Initialize system' : (needsUpgrade ? 'Upgrade' : (s.healthy ? (s.version !== s.codeVersion ? 'Repair and record version' : 'Run repair anyway') : 'Repair system'));
      show('teamBtn', s.initialized && s.healthy && !needsUpgrade);
      show('validateBtn', s.initialized);
      $('teamBtn').textContent = s.teamCount ? 'Create another team' : 'Create first team';
    }

    function init() {
      call('Setting up — this can take up to a minute…', 'apiInitializeSystem').then(function (r) {
        state = r.state;
        render();
        $('result').innerHTML = alertHtml('success', 'Done', '', r.actions);
        showStatus('', '');
      });
    }

    function createTeam() { openTool('team', null, 'apiShowTeamDialog', ''); }
    function validate() { google.script.run.menuValidateStructure(); }

    load();
  </script>
</body>
</html>
